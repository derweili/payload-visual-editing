name: Release

# On every push to main, changesets/action does one of two things:
# - pending changesets in .changeset/: opens or updates the "Version Packages" pull request
#   (versions bumped, CHANGELOG.md written, changesets removed)
# - no pending changesets (the Version Packages PR was merged): publishes every version that isn't
#   on npm yet, pushes the git tags and creates a GitHub Release per package.
#
# npm publishing uses Trusted Publishing (OIDC, `id-token: write`): no npm token, provenance
# attached. Each package has this workflow (release.yml) set as its trusted publisher on npmjs.com.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  WRANGLER_SEND_METRICS: false

jobs:
  release:
    name: Version PR or publish
    # Forks have no publish rights; skip instead of failing
    if: github.repository == 'derweili/payload-visual-editing'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # version commits, tags, GitHub Releases
      pull-requests: write # the Version Packages pull request
      id-token: write # npm Trusted Publishing and provenance
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds the packages (dist/ is what gets published), packs and installs the tarballs, then
      # imports and type-checks them. A broken package fails here, before anything is published.
      - name: Build and check the published packages
        run: pnpm pack:check

      - name: Create the Version Packages PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0 (v2 needs Changesets CLI v3)
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
