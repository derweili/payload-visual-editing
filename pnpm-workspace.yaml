packages:
  - packages/*
  # Demo site (Next + Payload on Neon/Vercel). Not published.
  - apps/*

allowBuilds:
  esbuild: true
  sharp: true
  # workerd: Miniflare's runtime for the in-memory D1 in tests and the test app
  workerd: true
  # Ships prebuilt binaries; its install script isn't needed
  '@swc/core': false
